name: Portafolio Workflow

on: # Disparadores del flujo de trabajo
  push: # Cuando se hace push a las ramas main, master o develop
    branches:
      - main
      - master
      - develop
      - seupt-githubActions
  pull_request: # Cuando se hace un pull request a las ramas main, master o develop
    branches:
      - main
      - master
      - develop
  
permissions: # Permisos del flujo de trabajo
  contents: read # Permite leer el contenido del repositorio

jobs:
  validate: #Nombre del trabajo 
    runs-on: ubuntu-latest # Sistema operativo en el que se ejecutará el trabajo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # Acción para hacer checkout del repositorio

      - name: Set up Node.js
        uses: actions/setup-node@v3 # Acción para configurar Node.js
        with:
          node-version: '24'
      
      - name: Validate HTML
        run: npx --yes htmlhint@1.9.2 "**/*.html" 

      - name: Validate javascript Syntax
        run: find . -type f -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -r -n1 node --check